# Deploys the Voice RAG app to the Hugging Face Space on every push to main.
# Works whether the app files are at the repository root (app.py, space_app.py, ...)
# or inside a v3/ folder.
# Setup once: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   HF_TOKEN = a Write token from the Hugging Face account that owns the Space
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button for manual deploys

concurrency:                  # never run two deploys at once; the newest wins
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACE_ID: ${{ vars.HF_SPACE_ID || 'harshpanchal241/voice-rag' }}
    defaults:
      run:
        shell: bash          # bash -eo pipefail: a failing command in a pipe fails the step
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face client
        run: pip install "huggingface_hub>=0.24,<2.0"

      - name: Find the app folder
        run: |
          if [ -f v3/app.py ]; then APP_DIR=v3; elif [ -f app.py ]; then APP_DIR=.; else
            echo "::error::Could not find app.py at the repository root or in v3/."; exit 1; fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "App folder: $APP_DIR"

      - name: Check required files are committed
        run: |
          missing=0
          for f in app.py space_app.py requirements.txt README.md \
                   scripts/upload_space.py scripts/fetch_indexes.py \
                   core/voice_quota.py core/security.py static/index.html static/studio/app.js; do
            if [ ! -f "$APP_DIR/$f" ]; then echo "::error file=$APP_DIR/$f::$APP_DIR/$f is not in the repository. Commit and push it."; missing=1; fi
          done
          exit $missing

      - name: Check token
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add the HF_TOKEN repository secret first."; exit 1; fi
          python -c "from huggingface_hub import whoami; print('Deploying as', whoami()['name'])"

      - name: Compile Python (catch syntax errors before deploying)
        working-directory: ${{ env.APP_DIR }}
        run: python -m compileall -q app.py space_app.py api core pipeline schemas services scripts

      - name: Files that will be uploaded
        working-directory: ${{ env.APP_DIR }}
        run: python scripts/upload_space.py --repo "$SPACE_ID" --dry-run | tail -n 5

      - name: Upload to the Space
        working-directory: ${{ env.APP_DIR }}
        env:
          DEPLOY_MESSAGE: "Deploy ${{ github.sha }}: ${{ github.event.head_commit.message }}"
        run: python scripts/upload_space.py --repo "$SPACE_ID" --sync

      - name: Summary
        run: |
          echo "### ✅ Deployed to https://huggingface.co/spaces/$SPACE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "The Space now rebuilds (3–10 min). App: https://${SPACE_ID/\//-}.hf.space" >> "$GITHUB_STEP_SUMMARY"
